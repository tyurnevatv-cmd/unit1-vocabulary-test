<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Listening Lesson 1 – Nice to Meet You!</title><style>
:root{--bg:#f3f7ff;--ink:#263550;--blue:#5658df;--line:#dce3f1;--muted:#66758e}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(140deg,#ecf3ff,#faf8ff);font:16px/1.6 system-ui,Arial,sans-serif}
header{position:sticky;top:0;z-index:2;background:white;border-bottom:1px solid var(--line);padding:12px clamp(14px,4vw,56px);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
header strong{font-size:clamp(17px,2.3vw,22px)}nav{display:flex;gap:5px;flex-wrap:wrap}
nav button{border:0;background:#eef1fb;padding:9px 12px;border-radius:14px;cursor:pointer;font-weight:750;color:#415273}nav button.active{background:var(--blue);color:white}
main{max-width:1120px;padding:18px 16px 35px;margin:auto}.slide{display:none;min-height:530px;padding:clamp(20px,5vw,52px);background:white;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 34px #172e5612}.slide.active{display:block}
.eyebrow{font-weight:800;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;font-size:13px}.slide h1{font-size:clamp(30px,5vw,49px);line-height:1.15;margin:12px 0 25px}.slide h3{margin-top:4px}.lead{font-size:clamp(18px,2.1vw,24px);color:#425773}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.grid.four{grid-template-columns:repeat(4,1fr)}.grid.three{grid-template-columns:repeat(3,1fr)}
.panel{border:1px solid var(--line);border-radius:16px;background:#f8faff;padding:19px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chips span{display:inline-block;padding:11px 15px;background:#edf0ff;border-radius:15px;font-weight:700}.chips.large span{font-size:18px}.option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.option-grid.four{grid-template-columns:repeat(4,1fr)}.option-grid>div{padding:28px 12px;border-radius:18px;text-align:center;background:#f2f6ff;font-size:clamp(17px,2.2vw,24px);font-weight:800}.option-grid span{font-size:14px;color:var(--muted)}
.note{background:#fff9df;border-left:5px solid #e8bb39;padding:17px 22px;margin:25px 0;border-radius:10px}.note.center{text-align:center}
.person{text-align:center;background:#eef4ff;border-radius:17px;padding:20px}.person b{display:block;margin:auto auto 10px;background:#5b65db;width:57px;height:57px;line-height:57px;border-radius:50%;color:white;font-size:24px}
.scene{display:grid;gap:18px;align-content:center;max-width:400px}.bubble{padding:28px;background:#e4edff;border-radius:20px 20px 20px 4px;font-size:24px;font-weight:700}.bubble.other{background:#eee7ff;border-radius:20px 20px 4px 20px;margin-left:25px}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}.line{font-size:21px}
label{font-weight:750;display:block}input:not([type=checkbox]){width:100%;padding:13px;border:1px solid #ccd8e9;border-radius:12px;font:inherit;margin:6px 0 12px;background:white}
.phrases{display:grid;grid-template-columns:1fr 1fr;gap:13px}.phrases label{background:#f2f6ff;border-radius:12px;padding:18px;display:flex;align-items:center;gap:12px;font-size:20px;cursor:pointer}.phrases input{height:20px;width:20px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:620px}td,th{padding:15px;text-align:left;border:1px solid var(--line)}th{background:#edf1ff}
blockquote{background:#f3f0ff;border-left:5px solid var(--blue);padding:20px;border-radius:12px;margin:20px 0;font-size:20px}.big{font-size:clamp(21px,3vw,29px)}
footer{display:flex;align-items:center;justify-content:center;gap:20px;padding:19px}footer button{border:0;border-radius:14px;background:var(--blue);color:white;padding:13px 22px;font-size:16px;font-weight:800;cursor:pointer}footer button:disabled{opacity:.3;cursor:not-allowed}#counter{font-weight:800;font-variant-numeric:tabular-nums}.small{color:var(--muted);font-size:13px;text-align:center}
@media(max-width:740px){header{position:static}.grid,.grid.four,.grid.three,.cards,.option-grid,.option-grid.four,.phrases,.split{grid-template-columns:1fr}.slide{min-height:auto}.option-grid>div{padding:13px}.scene{display:none}}
</style></head><body><header><strong>🎧 Listening Lesson 1 · Nice to Meet You!</strong><nav id="sections"></nav></header>
<main><div id="slides"></div><footer><button id="prev">← PREV</button><span id="counter">1 / 13</span><button id="next">NEXT →</button></footer><p class="small">Listening Extra · Unit 1.2 · Track 3 is played separately by the teacher. Online version of the original 13-slide lesson.</p></main>
<script>
const slides=[{"label":"START","title":"Nice to meet you!","kicker":"Listening 1.2 · Intermediate · Personal information","html":"<div class=\"split\"><div><p class=\"lead\">Listen for specific information and complete identity cards.</p><p class=\"line\">A: Hi! What’s your name?</p><p class=\"line\">B: I’m … Nice to meet you!</p><div class=\"chips\"><span>NAMES</span><span>NATIONALITIES</span><span>STUDIES</span></div></div><div class=\"scene\"><div class=\"bubble\">Hi! What’s<br>your name?</div><div class=\"bubble other\">I’m …<br>Nice to meet you!</div></div></div>"},{"label":"MEET","title":"Same school, different people","kicker":"Icebreaker · Quick reactions","html":"<p class=\"lead\">Choose your side. Use chat or reactions!</p><div class=\"option-grid\"><div>🎧 MUSIC <span>or</span> 🎮 GAMES?</div><div>🐶 DOGS <span>or</span> 🐱 CATS?</div><div>🌊 SEA <span>or</span> ⛰️ MOUNTAINS?</div></div><div class=\"note\">Type ONE thing classmates may not know about you:<br>“I can cook.” · “I collect comics.” · “I hate chocolate.”<br><strong>Wait for GO – everyone sends at the same time!</strong></div>"},{"label":"MEET","title":"Who said it?","kicker":"Listen for new details about classmates","html":"<div class=\"grid\"><div class=\"panel\"><h3>ROUND 1 · Four voices</h3><p>Teacher chooses four students. Each says:</p><blockquote>I’m ________. One thing you may not know about me is ________.</blockquote></div><div class=\"panel\"><h3>ROUND 2 · Memory check</h3><p>Everyone mutes. Teacher asks:</p><p>Who can cook?<br>Who collects something?<br>Who hates / loves …?</p></div></div><div class=\"note\">Type the NAME in chat – wait for GO.<br>Today’s skill: catch one specific detail and connect it to the speaker.</div>"},{"label":"PREP","title":"Today’s listening mission","kicker":"You do NOT need to understand every word","html":"<p class=\"lead\">Listen for the four anchors:</p><div class=\"option-grid four\"><div>👤 NAMES</div><div>🌍 COUNTRIES</div><div>🏫 PLACES OF STUDY</div><div>📚 SUBJECTS</div></div><div class=\"note\"><strong>Strategy:</strong> wait for the anchors and write only key words.</div>"},{"label":"PREP","title":"Personal information","kicker":"Quick poll · What is OK to share?","html":"<p class=\"lead\">Use reactions: 👍 OK to share · 🤔 maybe private</p><div class=\"chips large\"><span>name</span><span>nationality</span><span>school / place of study</span><span>favourite subject</span><span>hobby</span><span>date of birth</span><span>home address</span><span>phone number</span></div><div class=\"note\">You share one school. In the audio, place of study helps identify different speakers.<br><strong>You never have to share information that feels too personal.</strong></div>"},{"label":"PREP","title":"Before listening","kicker":"Know your targets","html":"<p class=\"lead\">You will meet four students at a youth hostel.</p><div class=\"grid four\"><div class=\"person\"><b>J</b><strong>James</strong></div><div class=\"person\"><b>P</b><strong>Peem</strong></div><div class=\"person\"><b>S</b><strong>Simone</strong></div><div class=\"person\"><b>T</b><strong>Takeyuki</strong></div></div><h3>What information goes on an identity card?</h3><div class=\"chips\"><span>NATIONALITY</span><span>PLACE OF STUDY</span><span>SUBJECT</span></div><div class=\"note\">Chat check: type N / P / S – which category is usually easiest for you to hear?</div>"},{"label":"LISTEN","title":"Listen 1: nationality","kicker":"Audio Track 3 · Listen without pausing","html":"<p class=\"lead\">Catch ONE detail: where each student is from.</p><div class=\"note\"><strong>Teacher plays Track 3 separately.</strong> Write only the nationality.</div><div class=\"answer-grid\"><label>J · James<input placeholder=\"Country / nationality\"></label><label>P · Peem<input placeholder=\"Country / nationality\"></label><label>S · Simone<input placeholder=\"Country / nationality\"></label><label>T · Takeyuki<input placeholder=\"Country / nationality\"></label></div><div class=\"note\">After listening, type: J=… P=… S=… T=…<br>Wait for GO before sending.</div>"},{"label":"LISTEN","title":"Listen 2: identity cards","kicker":"Audio Track 3 · Specific information","html":"<p class=\"lead\">Use your notebook or this form to complete the four identity cards.</p><div class=\"cards\"><div class=\"panel\"><h3>J · James</h3><label>Nationality<input placeholder=\"Nationality\"></label><label>Place of study<input placeholder=\"University / school\"></label><label>Subject<input placeholder=\"Subject\"></label></div><div class=\"panel\"><h3>P · Peem</h3><label>Nationality<input placeholder=\"Nationality\"></label><label>Place of study<input placeholder=\"University / school\"></label><label>Subject<input placeholder=\"Subject\"></label></div><div class=\"panel\"><h3>S · Simone</h3><label>Nationality<input placeholder=\"Nationality\"></label><label>Place of study<input placeholder=\"University / school\"></label><label>Subject<input placeholder=\"Subject\"></label></div><div class=\"panel\"><h3>T · Takeyuki</h3><label>Nationality<input placeholder=\"Nationality\"></label><label>Place of study<input placeholder=\"University / school\"></label><label>Subject<input placeholder=\"Subject\"></label></div></div><div class=\"note\">Chat check: send ONE answer you are confident about.</div>"},{"label":"CHECK","title":"Check your answers","kicker":"One point for each correct detail","html":"<div class=\"scroll\"><table><thead><tr><th>Student</th><th>Nationality</th><th>Place of study</th><th>Subject</th></tr></thead><tbody><tr><td>James</td><td>American</td><td>New York University</td><td>History</td></tr><tr><td>Peem</td><td>Thai</td><td>Assumption University</td><td>Engineering</td></tr><tr><td>Simone</td><td>French</td><td>the Sorbonne</td><td>History</td></tr><tr><td>Takeyuki</td><td>Japanese</td><td>Tokyo University</td><td>Computer Science</td></tr></tbody></table></div><p class=\"lead\">Score: _____ / 12</p><div class=\"note\">What helped you catch the details?</div>"},{"label":"CHECK","title":"Phrase detective","kicker":"Listen again · Which phrases do you hear?","html":"<div class=\"phrases\"><label><input type=\"checkbox\"><span>Pleased to meet you.</span></label><label><input type=\"checkbox\"><span>Are you from the States?</span></label><label><input type=\"checkbox\"><span>What do you study?</span></label><label><input type=\"checkbox\"><span>How about you?</span></label><label><input type=\"checkbox\"><span>That’s right.</span></label><label><input type=\"checkbox\"><span>That’s a Thai name, isn’t it?</span></label></div><div class=\"note\">Now label each phrase: <strong>GREETING · QUESTION · REACTION</strong></div>"},{"label":"SPEAK","title":"Mini interview","kicker":"Breakout room · Two people · Three minutes","html":"<div class=\"grid\"><div class=\"panel\"><h3>ASK</h3><p>1. What’s your name?</p><p>2. What do you usually do after school?</p><p>3. What’s one thing you’re really good at?</p><p>4. What are you into at the moment?</p></div><div class=\"panel\"><h3>LISTEN</h3><p>Write only three key details about your partner:</p><label>NAME<input></label><label>AFTER SCHOOL<input></label><label>GOOD AT / INTO<input></label></div></div><div class=\"note\">Cameras optional. No breakout rooms? Teacher pairs students in the main room; everyone else listens muted.</div>"},{"label":"SPEAK","title":"Introduce your partner","kicker":"Speakers talk · Listeners work in chat","html":"<blockquote class=\"big\">This is ________. After school, they usually ________. One thing they’re good at / into is ________.</blockquote><div class=\"note\"><strong>LISTENER CHALLENGE:</strong> After each introduction, type ONE fact you caught in chat.<br>NAME · AFTER SCHOOL · GOOD AT / INTO<br>Don’t copy the whole sentence – catch one key detail.</div>"},{"label":"FINISH","title":"Exit ticket","kicker":"One final message in the class chat","html":"<p class=\"lead\">Type your response, wait, then send on GO.</p><div class=\"grid three\"><div class=\"panel\"><h3>1 useful phrase</h3><p>e.g. Pleased to meet you.</p></div><div class=\"panel\"><h3>1 listening trick</h3><p>e.g. listen for names / key words</p></div><div class=\"panel\"><h3>1 word</h3><p>From today’s lesson</p></div></div><div class=\"note center\"><h2>3… 2… 1… SEND!</h2>Nice to meet you – see you next lesson!</div>"}];
const sectionNav=document.querySelector('#sections'), holder=document.querySelector('#slides');
holder.innerHTML=slides.map((s,i)=>'<section class="slide" data-category="'+s.label+'"><div class="eyebrow">Slide '+(i+1)+' / '+slides.length+' · '+s.kicker+'</div><h1>'+s.title+'</h1>'+s.html+'</section>').join('');
const cats=[...new Set(slides.map(s=>s.label))];
sectionNav.innerHTML=cats.map(c=>'<button data-cat="'+c+'">'+c+'</button>').join('');
const nodes=[...document.querySelectorAll('.slide')];
let index=0;
function go(i){index=Math.max(0,Math.min(nodes.length-1,i));nodes.forEach((n,j)=>n.classList.toggle('active',j===index));document.querySelector('#counter').textContent=(index+1)+' / '+nodes.length;document.querySelector('#prev').disabled=index===0;document.querySelector('#next').disabled=index===nodes.length-1;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.cat===slides[index].label));window.scrollTo(0,0)}
document.querySelector('#prev').onclick=()=>go(index-1);
document.querySelector('#next').onclick=()=>go(index+1);
sectionNav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(slides.findIndex(s=>s.label===b.dataset.cat)));
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});
go(0);
</script></body></html>
