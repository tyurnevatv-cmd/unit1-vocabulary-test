const STORE='military-231-progress-v1',PREF='military-231-english-only-v2';
function getStore(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function setStore(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let progress=getStore(STORE,{}),prefs=getStore(PREF,{lesson:'all',scope:'all',mode:'cards'});
if(!['all','8','9','10'].includes(prefs.lesson))prefs.lesson='all';
if(!['all','again','new'].includes(prefs.scope))prefs.scope='all';
if(!['cards','quiz','match','list'].includes(prefs.mode))prefs.mode='cards';
let order=[],pos=0,flipped=false,quiz=null,match=null,query='',limit=35;
const $=x=>document.getElementById(x);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function base(){return TERMS.filter(t=>prefs.lesson==='all'||String(t.lesson)===prefs.lesson)}
function pool(){return base().filter(t=>prefs.scope==='all'||(prefs.scope==='again'?progress[t.id]==='again':!progress[t.id]))}
function save(){setStore(PREF,prefs)}
function setMark(id,status){progress[id]=status;setStore(STORE,progress)}
function initCards(){order=shuffled(pool().map(t=>t.id));pos=0;flipped=false}
function stats(){let a=base(),k=a.filter(t=>progress[t.id]==='known').length, r=a.filter(t=>progress[t.id]==='again').length;return `<div class="statsbar"><span class="stat">${a.length} terms</span><span class="stat good">Known ${k}</span><span class="stat bad">Review ${r}</span></div>`}
function empty(){return `<div class="empty"><strong>No terms in this selection</strong>Choose another lesson or study set.<div class="actions"><button class="btn btnmain" data-act="reset">Show all terms</button></div></div>`}
function cards(){if(!order.length)return `<div class="worktitle"><h2>Flashcards</h2></div>${empty()}`;
let t=TERMS.find(x=>x.id===order[pos]);if(!t)return empty();
return `<div class="worktitle"><h2>Flashcards</h2><span class="counter">${pos+1} / ${order.length}</span></div>
<div class="progressbar"><div class="progressfill" style="width:${100*(pos+1)/order.length}%"></div></div>
<button class="flash" data-act="flip" aria-label="Flip card" aria-pressed="${flipped}"><div class="flashinner ${flipped?'back':''}"><div><div class="flash-tag">Lesson ${t.lesson} · ${flipped?'Translation':'English'}</div><div class="flashword">${esc(flipped?t.ru:t.en)}</div>${flipped?'':`<div class="flashipa">${esc(t.ipa)}</div>`}<div class="flashhint">${flipped?'Tap to return':'Tap to reveal the translation'}</div></div></div></button>
<div class="actions"><button class="btn btnsoft" data-act="prev">← Previous</button><button class="btn btnsoft" data-act="next">Next →</button><button class="btn btngood" data-act="known">✓ Know it</button><button class="btn btnwarn" data-act="again">↻ Review</button></div><div class="actions"><button class="btn btnsoft" data-act="shuffle">Shuffle</button><button class="btn btnsoft" data-act="speak">🔊 Listen</button></div>${stats()}`}
function quizOpts(t){let candidates=shuffled(base().filter(x=>x.id!==t.id && x.ipa!==t.ipa));let seen=new Set([t.en.toLowerCase()]),alt=[];for(let x of candidates){if(!seen.has(x.en.toLowerCase())){seen.add(x.en.toLowerCase());alt.push(x)}if(alt.length===3)break}return shuffled([t,...alt])}
function startQuiz(){let set=pool();if(!set.length){quiz={empty:true};render();return}let amount=Math.min(Number($('quizamount')?.value||10),set.length);quiz={items:shuffled(set).slice(0,amount),index:0,correct:0,answered:null,opts:null,done:false};render()}
function quizView(){if(!quiz||quiz.empty){if(!pool().length)return empty();return `<div class="quizstart"><h3>IPA Quiz</h3><p>Choose the English term that matches the transcription.</p><div class="quiz-settings"><label for="quizamount" class="mini" style="margin:0">Questions</label><select id="quizamount"><option value="10">10</option><option value="20">20</option><option value="231">All (${pool().length})</option></select></div><button class="btn btnmain" data-act="startquiz">Start quiz →</button></div>`}
if(quiz.done)return `<div class="quizstart"><h3>${quiz.correct} / ${quiz.items.length}</h3><p>${Math.round(quiz.correct*100/quiz.items.length)}% correct. Missed words are saved for review.</p><button class="btn btnmain" data-act="newquiz">Try again</button> <button class="btn btnsoft" data-act="review">Review errors</button></div>`;
let t=quiz.items[quiz.index];if(!quiz.opts)quiz.opts=quizOpts(t);return `<div class="worktitle"><h2>IPA Quiz</h2><span class="counter">${quiz.index+1} / ${quiz.items.length}</span></div><div class="progressbar"><div class="progressfill" style="width:${100*quiz.index/quiz.items.length}%"></div></div>
<div class="question">Which term matches this transcription?</div><div class="prompt">${esc(t.ipa)}</div><div class="answers">${quiz.opts.map(o=>`<button class="optbtn ${quiz.answered?(o.id===t.id?'correct':quiz.answered===o.id?'wrong':'dimmed'):''}" data-option="${esc(o.id)}" ${quiz.answered?'disabled':''}>${esc(o.en)}</button>`).join('')}</div>
${quiz.answered?`<div class="feedback ${quiz.answered===t.id?'':'wrong'}">${quiz.answered===t.id?'Correct!':'Review: '+esc(t.en)}</div><div class="quizfooter"><span class="counter">${quiz.correct} correct</span><button class="btn btnmain" data-act="quiznext">${quiz.index===quiz.items.length-1?'See results →':'Next question →'}</button></div>`:''}`}
function initMatch(){let all=shuffled(pool()),uniq=[],seen=new Set();for(let t of all){if(seen.has(t.ipa))continue;uniq.push(t);seen.add(t.ipa);if(uniq.length===6)break}match=uniq.length<2?{empty:true}:{set:uniq,left:shuffled(uniq),right:shuffled(uniq),l:null,r:null,done:[],mistakes:0,checking:false}}
function matchView(){if(!match)initMatch();if(match.empty)return empty();let m=match,n=m.set.length;return `<div class="worktitle"><h2>Match the term and IPA</h2><span class="counter">${m.done.length} / ${n} · ${m.mistakes} mistakes</span></div><div class="subhead">Choose one term and its transcription.</div><div class="progressbar"><div class="progressfill" style="width:${100*m.done.length/n}%"></div></div>
${m.done.length===n?`<div class="note">Round complete! <button class="btn btnmain" data-act="newmatch">New round</button></div>`:''}
<div class="matchgrid"><div class="matchcol"><h3>English</h3>${m.left.map(t=>`<button class="matchbtn ${m.done.includes(t.id)?'matched':''} ${m.l===t.id?'selected':''}" data-match="left:${t.id}" ${m.done.includes(t.id)||m.checking?'disabled':''}>${esc(t.en)}</button>`).join('')}</div><div class="matchcol"><h3>IPA</h3>${m.right.map(t=>`<button class="matchbtn ${m.done.includes(t.id)?'matched':''} ${m.r===t.id?'selected':''}" data-match="right:${t.id}" ${m.done.includes(t.id)||m.checking?'disabled':''}>${esc(t.ipa)}</button>`).join('')}</div></div><div class="actions"><button class="btn btnsoft" data-act="newmatch">New set</button></div>`}
function wordList(){let a=pool().filter(t=>(t.en+' '+t.ipa).toLowerCase().includes(query.toLowerCase().trim()));return `<div class="worktitle"><h2>Word List</h2><span class="counter">${a.length} terms</span></div><div class="searchrow"><input type="search" id="search" value="${esc(query)}" placeholder="Search English terms…" aria-label="Search terms"><button class="btn btnsoft" data-act="clear">Clear</button></div><div id="wordlist">${a.slice(0,limit).map(t=>`<div class="lexitem"><b>${esc(t.en)}</b><div class="ipa">${esc(t.ipa)}</div></div>`).join('')}</div>${a.length>limit?`<div class="actions"><button class="btn btnsoft" data-act="more">Show more (${a.length-limit})</button></div>`:''}`}
function render(){document.querySelectorAll('[data-lesson]').forEach(b=>{b.classList.toggle('active',b.dataset.lesson===prefs.lesson);b.setAttribute('aria-pressed',String(b.dataset.lesson===prefs.lesson))});$('scope').value=prefs.scope;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===prefs.mode)));$('workarea').innerHTML=({cards,quiz:quizView,match:matchView,list:wordList})[prefs.mode]()}
function reset(){initCards();quiz=null;match=null;limit=35;save();render()}
function advance(n){if(!order.length)return;pos=(pos+n+order.length)%order.length;flipped=false;render()}
function pair(side,id){if(!match||match.checking||match.done.includes(id))return;const m=match;if(side==='left')m.l=m.l===id?null:id;else m.r=m.r===id?null:id;
if(m.l&&m.r){if(m.l===m.r){m.done.push(m.l);m.l=null;m.r=null;render()}else{m.mistakes++;setMark(m.l,'again');m.checking=true;render();setTimeout(()=>{if(match===m){m.l=null;m.r=null;m.checking=false;render()}},480)}}else render()}
document.addEventListener('click',e=>{let l=e.target.closest('[data-lesson]');if(l){prefs.lesson=l.dataset.lesson;reset();return}let m=e.target.closest('[data-mode]');if(m){prefs.mode=m.dataset.mode;if(prefs.mode==='match')initMatch();save();render();return}
let o=e.target.closest('[data-option]');if(o){if(quiz&&!quiz.answered&&!quiz.done){let t=quiz.items[quiz.index];quiz.answered=o.dataset.option;if(quiz.answered===t.id)quiz.correct++;else setMark(t.id,'again');render()}return}
let p=e.target.closest('[data-match]');if(p){let [side,id]=p.dataset.match.split(':');pair(side,id);return}
let b=e.target.closest('[data-act]');if(!b)return;let act=b.dataset.act;
if(act==='flip'){flipped=!flipped;render()}else if(act==='prev')advance(-1);else if(act==='next')advance(1);
else if(act==='known'||act==='again'){if(order.length){setMark(order[pos],act==='known'?'known':'again');advance(1)}}
else if(act==='shuffle'){initCards();render()}else if(act==='speak'){if(order.length){let x=TERMS.find(t=>t.id===order[pos]);if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x.en.replace(/ \([^)]*\)/g,''));u.lang='en-GB';u.rate=.83;speechSynthesis.speak(u)}}}
else if(act==='startquiz')startQuiz();else if(act==='quiznext'){if(quiz.index===quiz.items.length-1)quiz.done=true;else{quiz.index++;quiz.answered=null;quiz.opts=null}render()}
else if(act==='newquiz'){quiz=null;render()}else if(act==='review'){prefs.scope='again';prefs.mode='cards';reset()}
else if(act==='newmatch'){initMatch();render()}else if(act==='reset'){prefs.scope='all';reset()}
else if(act==='more'){limit+=35;render()}else if(act==='clear'){query='';limit=35;render()}});
$('scope').addEventListener('change',e=>{prefs.scope=e.target.value;reset()});
document.addEventListener('input',e=>{if(e.target.id==='search'){let caret=e.target.selectionStart;query=e.target.value;limit=35;render();let n=$('search');if(n){n.focus();n.setSelectionRange(caret,caret)}}});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(prefs.mode==='cards'){if(e.key==='ArrowRight'){e.preventDefault();advance(1)}if(e.key==='ArrowLeft'){e.preventDefault();advance(-1)}if(e.key===' '){e.preventDefault();flipped=!flipped;render()}}});
initCards();render();
</script></body></html>
